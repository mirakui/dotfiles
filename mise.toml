[settings]
dotfiles.default_mode = "symlink"

[dotfiles]
# claude
"~/.claude/*" = { source = "claude/*" }
# 全プロジェクト共通の Claude 設定は naruta-mono が正本 (クラウド実行の Claude と共有するため)
"~/.claude/CLAUDE.md" = "~/work/naruta-mono/claude-home/CLAUDE.md"
"~/.claude/agents" = "~/work/naruta-mono/claude-home/agents"
"~/.claude/commands" = "~/work/naruta-mono/claude-home/commands"
"~/.claude/rules" = "~/work/naruta-mono/claude-home/rules"
"~/.claude/skills" = "~/work/naruta-mono/claude-home/skills"
"~/.claude/wiki" = "~/work/naruta-mono/docs/wiki"

# git
"~/.gitconfig" = "git/.gitconfig"
"~/.gitignore_global" = "git/.gitignore_global"

# ghostty
"~/.config/ghostty" = "ghostty"

# herdr
"~/.config/herdr/config.toml" = "herdr/config.toml"

# terraform
"~/.terraformrc" = "terraform/.terraformrc"

# tmux
"~/.tmux.conf" = "tmux/.tmux.conf"

# vim / nvim
"~/.vim" = "vim/.vim"
"~/.vimrc" = "vim/.vimrc"
"~/.config/nvim" = "nvim"

# wezterm
"~/.config/wezterm" = "wezterm"

# zed
"~/.config/zed" = "zed"

# zsh
"~/.zshrc" = "zsh/.zshrc"
"~/.config/starship.toml" = "zsh/starship.toml"

# zellij
"~/.config/zellij" = "zellij"
